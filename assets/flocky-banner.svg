<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Flocky</title>
  <desc id="desc">A terse control-plane diagram: one project owner routes work to repository streams.</desc>
  <defs>
    <pattern id="microgrid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0V12" fill="none" stroke="#d7e0d9" stroke-opacity=".045"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="#0a0c0b"/>
  <rect width="1200" height="320" fill="url(#microgrid)"/>
  <rect x="22" y="22" width="1156" height="276" fill="none" stroke="#d7e0d9" stroke-opacity=".24"/>
  <path d="M22 68h1156M22 252h1156" stroke="#d7e0d9" stroke-opacity=".14"/>

  <g fill="#b8c3bc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="1.4">
    <text x="43" y="51">FLOCKY / CONTROL PLANE</text>
    <text x="965" y="51">LOCAL CONTROL PLANE</text>
    <text x="43" y="280">SIGNED TASK ROUTING · REPOSITORY-SCOPED AGENTS · DURABLE RESULTS</text>
  </g>

  <g transform="translate(52 94)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect width="195" height="128" fill="#0a0c0b" stroke="#d7e0d9" stroke-opacity=".7"/>
    <path d="M0 31h195" stroke="#d7e0d9" stroke-opacity=".3"/>
    <text x="14" y="21" fill="#c8ff3d" font-size="13" letter-spacing="1.6">[ OWNER ]</text>
    <text x="14" y="61" fill="#ecf2ec" font-size="20">project</text>
    <text x="14" y="87" fill="#ecf2ec" font-size="20">orchestrator</text>
    <text x="14" y="113" fill="#9ca89f" font-size="12" letter-spacing=".8">TASKS / RESULTS</text>
  </g>

  <g fill="none" stroke="#c8ff3d" stroke-width="2">
    <path d="M247 126H353V104H432"/>
    <path d="M247 145H385V145H432"/>
    <path d="M247 164H353V186H432"/>
    <path d="M247 183H280V227H432"/>
  </g>
  <g fill="#c8ff3d">
    <rect x="427" y="99" width="10" height="10"/>
    <rect x="427" y="140" width="10" height="10"/>
    <rect x="427" y="181" width="10" height="10"/>
    <rect x="427" y="222" width="10" height="10"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
    <text x="455" y="108" fill="#ecf2ec">stream::01</text>
    <text x="455" y="149" fill="#ecf2ec">stream::02</text>
    <text x="455" y="190" fill="#ecf2ec">stream::03</text>
    <text x="455" y="231" fill="#ecf2ec">stream::04</text>
  </g>

  <g transform="translate(691 109)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="0" y="0" fill="#ecf2ec" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="55" font-weight="800" letter-spacing="-1">FLOCKY</text>
    <text x="3" y="36" fill="#c8ff3d" font-size="16" letter-spacing="2.2">REPOSITORY AGENT ORCHESTRATION</text>
    <path d="M3 54h426" stroke="#d7e0d9" stroke-opacity=".5"/>
    <text x="3" y="94" fill="#aeb8b1" font-size="18">one owner → many focused streams</text>
  </g>

  <g fill="#c8ff3d">
    <rect x="22" y="22" width="6" height="6"/>
    <rect x="1172" y="292" width="6" height="6"/>
  </g>
</svg>
